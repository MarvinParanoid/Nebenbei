server {
    listen      80;
    server_name _;
    charset     utf-8;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    # Vite writes content-hashed filenames here, so they can be cached forever.
    location /assets/ {
        try_files  $uri =404;
        # One header, not `expires` plus `add_header`: those emit two competing
        # Cache-Control lines.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Routing is client-side (hash based); the fallback keeps any other path
    # from 404-ing, and index.html itself must never be cached.
    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
