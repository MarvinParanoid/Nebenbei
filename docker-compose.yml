services:
  app:
    # Both, on purpose: `docker compose pull` takes the image CI published, and
    # `docker compose up --build` still builds from this checkout — the only way
    # to deploy work that is not pushed yet. The tag is a variable so a rollback
    # is a tag, not a rebuild: the deploy script passes the commit it was asked
    # for.
    image: ghcr.io/marvinparanoid/nebenbei:${NEBENBEI_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      # Bound to loopback: Caddy in front terminates TLS. 8000 and 8080 on this
      # host are already taken by sparschwein and openvpn-ui.
      - "127.0.0.1:8001:80"
    logging:
      # Scanners hammer the public URL around the clock; without a cap the log
      # grows until the disk is full.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
